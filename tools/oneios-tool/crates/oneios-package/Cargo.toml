[package]
name = "oneios-package"
version.workspace = true
edition.workspace = true
license.workspace = true

# `oneios-tool package`: the checks, the manifest and the archive of the runtime package (runtime/package.sh; was
# runtime/package/pack.py). The Apple-file check of every release is here: src/pack.rs.
[dependencies]
anyhow.workspace = true
clap.workspace = true
sha2.workspace = true
# runtime.json (json), repr() in the refusals
oneios-common.workspace = true
# lib/guest/: the CDHash, identifier and platform of our iOS plug-ins (their macho reader)
oneios-tweaks.workspace = true
# the package's tar
tar = { version = "0.4", default-features = false }

[dev-dependencies]
# the signed Mach-Os of the lib/guest/ tests (debug fixture's signed_macho)
oneios-testkit.workspace = true
